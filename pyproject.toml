[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "leaderboard"
version = "0.1.0"
description = "Leaderboard closed-loop code-scenario evaluation toolkit for CARLA."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "RoadTailBench Authors" }]
dependencies = []

[project.scripts]
leaderboard-run = "leaderboard.cli.run:main"
leaderboard-eval = "leaderboard.cli.eval:main"
leaderboard-metrics-csv = "leaderboard.cli.metrics_csv:main"
leaderboard-plot = "leaderboard.cli.plot_run:main"
leaderboard-video = "leaderboard.cli.video:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["leaderboard*"]
